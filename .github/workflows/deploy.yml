name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
env:
  CUSTOM_DOMAIN: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Domínio customizado; mantém HTTPS automático
          custom_domain: groupbasebytecn.com.br
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
